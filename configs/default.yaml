# configs/default.yaml

pipeline:
  loader:    txt
  chunker:   fixed
  embedder:  bge_small
  index:     faiss_flat
  retriever: vector
  reranker:  null
  generator: openai

chunker:
  fixed:
    chunk_size:    512
    chunk_overlap: 50

embedder:
  bge_small:
    model_name: BAAI/bge-small-en-v1.5
    batch_size: 32

index:
  faiss_flat:
    dimension: 384

retriever:
  vector:
    top_k: 5

generator:
  openai:
    model:      gpt-4o-mini
    max_tokens: 512
    temperature: 0.0