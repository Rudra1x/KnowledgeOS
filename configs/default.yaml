# configs/default.yaml

chunker:
  fixed:
    chunk_size:    300
    chunk_overlap: 0

embedder:
  bge_small:
    model_name: BAAI/bge-small-en-v1.5
    batch_size: 32

index:
  faiss_flat:
    dimension: 384

retriever:
  vector:
    top_k: 5

pipeline:
  loader:    txt
  chunker:   fixed
  embedder:  bge_small
  index:     faiss_flat
  retriever: vector
  reranker:  null
  generator: openrouter

# ... other sections unchanged ...

generator:
  openrouter:
    model:       openrouter/free
    max_tokens:  512
    temperature: 0.0
  local:
    local_model:    qwen2.5:3b-instruct
    fallback_model: openrouter/free
    max_tokens:     512
    temperature:    0.0